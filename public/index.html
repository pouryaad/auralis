<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Auralis Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap">
<style>
/* Layout concept: a quiet instrument for public tenders. Fixed sidebar, one working column of panels, detail drawer from the
   right, bottom tab bar on phones. Deadlines are the heartbeat: every tender carries a dated deadline block coloured by urgency. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eceff3; --surface-3:#e3e8ed;
  --ink:#0f1417; --ink-2:#46515a; --ink-3:#69747e; --line:rgba(15,20,23,.09); --line-2:rgba(15,20,23,.16);
  --accent:#0b7d76; --accent-ink:#ffffff; --accent-soft:rgba(11,125,118,.10); --accent-line:rgba(11,125,118,.35);
  --gold:#8f7140; --ok:#1b844b; --warn:#9c5a00; --bad:#b4342c;
  --ok-soft:rgba(27,132,75,.11); --warn-soft:rgba(156,90,0,.11); --bad-soft:rgba(180,52,44,.10);
  --glass:rgba(255,255,255,.74); --scrim:rgba(10,14,17,.42);
  --shadow-1:0 1px 2px rgba(15,20,23,.05),0 8px 24px -14px rgba(15,20,23,.18);
  --shadow-2:0 30px 80px -24px rgba(15,20,23,.32);
  --f-display:'Sora',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --gut:clamp(16px,2.6vw,32px); --pad:22px; --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e10; --surface:#13171a; --surface-2:#1a1f23; --surface-3:#22292e;
  --ink:#eef2f4; --ink-2:#adb8c0; --ink-3:#86919a; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --accent:#46cdc1; --accent-ink:#032321; --accent-soft:rgba(70,205,193,.13); --accent-line:rgba(70,205,193,.4);
  --gold:#d3b67e; --ok:#52c987; --warn:#e9a54b; --bad:#f08b80;
  --ok-soft:rgba(82,201,135,.13); --warn-soft:rgba(233,165,75,.13); --bad-soft:rgba(240,139,128,.13);
  --glass:rgba(19,23,26,.76); --scrim:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7); --shadow-2:0 30px 90px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e10; --surface:#13171a; --surface-2:#1a1f23; --surface-3:#22292e;
  --ink:#eef2f4; --ink-2:#adb8c0; --ink-3:#86919a; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --accent:#46cdc1; --accent-ink:#032321; --accent-soft:rgba(70,205,193,.13); --accent-line:rgba(70,205,193,.4);
  --gold:#d3b67e; --ok:#52c987; --warn:#e9a54b; --bad:#f08b80;
  --ok-soft:rgba(82,201,135,.13); --warn-soft:rgba(233,165,75,.13); --bad-soft:rgba(240,139,128,.13);
  --glass:rgba(19,23,26,.76); --scrim:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7); --shadow-2:0 30px 90px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.2rem,2.4vw,1.5rem);font-weight:600}
h2{font-size:1.02rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);z-index:45;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px;font-family:var(--f-display);font-weight:600;font-size:1.08rem;letter-spacing:-.03em}
.mark{width:30px;height:30px;border-radius:10px;flex:none;position:relative;background:conic-gradient(from 200deg,var(--accent),var(--gold),var(--accent));box-shadow:inset 0 0 0 1px var(--line)}
.mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.02em;color:var(--ink-3)}
.navgrp{display:grid;gap:2px}
.navgrp .eyebrow{padding:0 12px 6px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-sm);background:none;color:var(--ink-2);text-align:left;font-weight:500;transition:background .2s,color .2s}
.nv svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nv .ct{margin-left:auto;font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fresh{margin-top:auto;padding:14px;border-radius:var(--r-md);background:var(--surface-2);display:grid;gap:4px;font-size:.82rem;color:var(--ink-2)}
.fresh b{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.dot.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid var(--line)}
.top h1{margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--ink-2);transition:background .2s,color .2s,transform .2s var(--ease)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib:active{transform:scale(.95)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none}
.search{position:relative;width:min(380px,36vw);min-width:0}
.search input{width:100%;height:40px;padding:0 44px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.search>svg{position:absolute;left:13px;top:12px;width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.search kbd{position:absolute;right:10px;top:9px;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface-2)}
.search .clr{position:absolute;right:5px;top:5px;width:30px;height:30px;border:0;border-radius:9px;background:var(--surface-2)}
#q::-webkit-search-cancel-button{display:none}
#view{padding-block:var(--gut) calc(var(--gut) + 24px);padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:grid;gap:var(--gut);min-width:0;align-content:start}
#view:focus{outline:none}
.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--pad);min-width:0;box-shadow:var(--shadow-1)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph>div{min-width:0}
.sub{color:var(--ink-3);font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gut)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.lead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lead h2{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:500;letter-spacing:-.035em;max-width:30ch}
.lead h2 em{font-style:normal;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut)}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;padding:18px var(--pad);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);min-width:0;transition:transform .25s var(--ease),border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line-2)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi .l{font-size:.82rem;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.kpi .n{font-family:var(--f-display);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:500;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .h{font-size:.78rem;color:var(--ink-3)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);transition:background .2s,border-color .2s,transform .15s var(--ease);text-align:center}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:.84rem;border-radius:9px}
.btn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
.ctl{width:100%;min-width:0;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:.9rem;transition:border-color .2s,box-shadow .2s}
textarea.ctl{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.45}
.ctl:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
select.ctl{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
select[multiple].ctl{height:auto;padding:6px;background-image:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:.76rem;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.chip.mono{font-family:var(--f-mono);font-weight:500;font-size:.72rem}
button.chip{border:0;cursor:pointer}
button.chip:hover{filter:brightness(.97)}
.sw{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--surface-3);flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

/* ---------- tender rows ---------- */
.tl{display:grid;gap:8px;min-width:0}
.tr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px 12px 12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.tr:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.tr.hid{opacity:.55}
.due{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;align-content:center;gap:1px;width:64px;min-height:64px;padding:6px 4px;border-radius:14px;background:var(--surface-2);text-align:center;font-variant-numeric:tabular-nums}
.due b{font-family:var(--f-display);font-size:1.35rem;font-weight:500;letter-spacing:-.04em;line-height:1}
.due span{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.due em{font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2)}
.due.u-bad{background:var(--bad-soft)}.due.u-bad em,.due.u-bad b{color:var(--bad)}
.due.u-warn{background:var(--warn-soft)}.due.u-warn em,.due.u-warn b{color:var(--warn)}
.due.u-past{opacity:.6}.due.u-past b{text-decoration:line-through}
.due.u-none{background:transparent;border:1px dashed var(--line-2)}
.due:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tm{min-width:0;display:grid;gap:5px}
.tt{all:unset;cursor:pointer;font-weight:600;font-size:.97rem;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tt:hover{color:var(--accent)}
.tt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--ink-3);min-width:0}
.meta .by{color:var(--ink-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ta{display:flex;align-items:center;gap:6px}
.star{color:var(--ink-3)}
.star[aria-pressed=true]{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-color:transparent}
.star svg{width:17px;height:17px}
.star[aria-pressed=true] svg{fill:currentColor}
mark{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.more{display:flex;justify-content:center;padding-top:6px}
.sk{height:88px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:300% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{to{background-position:-150% 0}}

/* ---------- filters ---------- */
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.active-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.active-f .chip{height:28px;padding:0 6px 0 11px}
.active-f .chip span{opacity:.6;font-size:.95em;padding:0 3px}
.ftoggle{display:none}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--ink-2);font-size:.86rem;margin-top:14px}
.hint svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;margin-top:1px}
.hint b{color:var(--ink)}

/* ---------- empty / onboarding ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-weight:600}
.onb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--gut);align-items:start}
.onb h2{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:500;letter-spacing:-.035em;margin-bottom:10px}
.steps{display:grid;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:var(--r-md);background:var(--surface-2);font-size:.9rem;color:var(--ink-2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--accent)}
.steps.plain li{grid-template-columns:minmax(0,1fr)}
.steps.plain li::before{display:none}
.steps b{color:var(--ink);display:block}
code{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}

/* ---------- chart ---------- */
.chartbox{position:relative;width:100%;min-width:0}
.chartbox svg{display:block;width:100%;height:210px;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cx{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:9px;font-size:.78rem;font-weight:600;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tbs{max-height:210px;overflow:auto}
table.tb{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
.tb th,.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tb th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);position:sticky;top:0;background:var(--surface)}
.bars{display:grid;gap:4px}
.bar{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 4ch;gap:12px;align-items:center;font-size:.86rem;padding:6px 8px;border-radius:9px}

 (D.tenders.length?'<span>'+plural(D.tenders.length,'Ausschreibung','Ausschreibungen')+' · Stand '+esc(ago(D.generatedAt))+'</span>':'<span>Unter Quellen verbinden</span>')+(errSrc?'<span style="color:var(--warn)">'+plural(errSrc,'Quelle meldet','Quellen melden')+' Probleme</span>':'')}
function render(keep){
 if(!ROUTES[st.route])st.route='overview';var r=ROUTES[st.route];
 $('#title').textContent=r[0];document.title='Auralis · '+r[0];
 var y=window.scrollY;$('#view').innerHTML=V[st.route]();renderNav();
 if(keep)$$('.enter',$('#view')).forEach(function(e){e.classList.remove('enter')});
 if(st.route==='overview')drawChart();
 if(st.route==='tenders')renderList();
 window.scrollTo(0,keep?y:0);save()}
function go(r){if(!ROUTES[r])return;var changed=st.route!==r;st.route=r;listLimit=PAGE;closeAll();hideSug();render(!changed);
 try{if(location.hash.slice(1)!==r)history.replaceState(null,'','#'+r)}catch(e){}
 if(changed)try{$('#view').focus({preventScroll:true})}catch(e){}}
function refresh(){renderNav();if(openId&&D.byId[openId])openDrawer(openId);else if(openId)closeAll();
 if(st.route==='tenders'&&$('#list')){renderList();save();return}render(true)}

/* ---------------- Feed laden ---------------- */
function storeFeed(feed){return idb.set('feed',feed).then(function(ok){D.cacheOk=!!ok})}
function busy(){return !!openId||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')}
function loadFeed(manual){
 if(D.loading)return Promise.resolve();D.loading=true;renderNav();
 var ctl=('AbortController' in window)?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},25000),prev=D.generatedAt,changedView=false;
 return fetch(st.feed.url,{cache:'no-cache',signal:ctl?ctl.signal:undefined}).then(function(r){
   if(r.status===404)throw new Error('Unter „'+st.feed.url+'“ liegt kein Feed. Abruf-Dienst ausführen oder die Datei importieren.');
   if(!r.ok)throw new Error('Der Feed-Server antwortet mit HTTP '+r.status+'.');
   return r.json().catch(function(){throw new Error('Die Feed-Datei ist kein gültiges JSON.')})}).then(function(f){
   D.error=null;D.loadedAt=Date.now();
   if(!f||!Array.isArray(f.tenders))throw new Error('Die Feed-Datei hat nicht das erwartete Format (Feld "tenders" fehlt).');
   if(!f.tenders.length&&D.tenders.length&&D.origin==='import'){D.serverEmpty=f;return} /* leerer Server-Feed verdrängt keinen Import */
   var isNew=(f.generatedAt||null)!==prev||!D.tenders.length&&f.tenders.length;
   if(!isNew&&!manual){if(!D.sources.length&&f.sources)ingest(f);return}
   if(!manual&&D.tenders.length&&busy()){D.pending=f;toast('Neue Ausschreibungen verfügbar','Anzeigen',applyPending,15000);return}
   ingest(f);D.origin='server';changedView=true;storeFeed(f).then(function(){if(st.route==='sources')render(true)});
   if(manual)toast(plural(D.tenders.length,'Ausschreibung','Ausschreibungen')+' geladen')}).catch(function(e){
   D.error=e&&e.name==='AbortError'?'Zeitüberschreitung beim Laden des Feeds.':e instanceof TypeError?'Feed nicht erreichbar. Erlaubt sind nur Dateien auf demselben Server; sonst die Datei importieren.':String(e&&e.message||e);
   if(manual)toast('Aktualisierung fehlgeschlagen')}).then(function(){clearTimeout(to);D.loading=false;
   if(changedView||manual||!D.tenders.length||st.route==='sources')refresh();else renderNav()})}
function applyPending(){if(!D.pending)return;ingest(D.pending);D.origin='server';storeFeed(D.pending);D.pending=null;refresh()}
function importFeed(text,label){var f;try{f=JSON.parse(text)}catch(e){toast('Import fehlgeschlagen: kein gültiges JSON');return}
 var before={t:D.tenders,b:D.byId,s:D.sources,n:D.srcName,g:D.generatedAt};
 try{ingest(f)}catch(e){toast('Import fehlgeschlagen: '+e.message);return}
 if(!D.tenders.length&&f.tenders.length){D.tenders=before.t;D.byId=before.b;D.sources=before.s;D.srcName=before.n;D.generatedAt=before.g;HC={};toast('Import fehlgeschlagen: kein Eintrag hat Titel und gültigen http(s)-Link');return}
 D.origin='import';D.error=null;storeFeed(f).then(function(){if(st.route==='sources')render(true)});
 toast(plural(D.tenders.length,'Ausschreibung','Ausschreibungen')+' aus '+label+' übernommen');refresh()}

/* ---------------- Dateien sichern: im Artifact über die downloads-Fähigkeit, eigenständig per Browser-Download ---------------- */
function saveFile(name,text,mime){
 var cl=window.claude;
 if(cl&&typeof cl.use==='function'){cl.use('downloads').then(function(dl){if(!dl)throw {code:'unavailable'};return dl.save({filename:name,data:text})}).then(function(){toast('Gespeichert: '+name)}).catch(function(e){
  if(e&&e.code==='declined')return;copy(text,'Speichern geht hier nicht. Der Inhalt wurde stattdessen kopiert.')});return}
 try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);toast('Gespeichert: '+name)}catch(e){copy(text)}}
function csvCell(v){var s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(list){var rows=[['Titel','Auftraggeber','Kategorie','Medien-relevant','Land','Bundesland/Region','Veröffentlicht','Frist','Fristart','Auftragswert EUR','Quelle','CPV','Ausschreibungslink','Bewerbungslink']];
 list.forEach(function(t){var pd=t.pub===NOPUB?'':dateOf(t.pub);rows.push([t.title,t.auth,t.cat,t.media?'ja':'nein',t.land,t.reg,pd?pd.getFullYear()+'-'+('0'+(pd.getMonth()+1)).slice(-2)+'-'+('0'+pd.getDate()).slice(-2):'',t.dueUnknown?'':t.deadline,t.dueUnknown?'':dueKindTxt(t),t.value==null?'':Math.round(t.value),D.srcName[t.src]||t.src,t.cpv.join(' '),t.url,t.applyKind==='notice'?'':t.apply])});
 return '﻿'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n')}
function copy(s,msg){var done=function(ok){toast(ok?(msg||'Kopiert'):'Kopieren nicht möglich. Bitte den Text markieren und manuell kopieren.')};
 function fallback(){try{var ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){done(true)},function(){done(fallback())});return}}catch(e){}done(fallback())}

/* ---------------- Ereignisse ---------------- */
function setStage(id,val,quiet){var m=ts(id),old=m.stage;m.stage=val==='x'||val===null?null:+val;
 if(!quiet)toast(m.stage===null?'Aus der Pipeline entfernt':'Stufe: '+STAGES[m.stage],'Rückgängig',function(){m.stage=old;refresh()})}
document.addEventListener('click',function(e){
 var tgt=e.target;
 var sg=tgt.closest('[data-sug]');if(sg){pick(+sg.getAttribute('data-sug'));return}
 if(!tgt.closest('#sug,#sform'))hideSug();
 var o=tgt.closest('[data-open]');if(o&&!tgt.closest('[data-act]')){openDrawer(o.getAttribute('data-open'));return}
 var g=tgt.closest('[data-go]');if(g){var set=g.getAttribute('data-set');if(set){var i=set.indexOf(':'),k=set.slice(0,i),val=set.slice(i+1),nf=defaultF();nf.sort=F.sort;nf[k]=val;F=nf;$('#q').value='';syncClr()}go(g.getAttribute('data-go'));return}
 var a=tgt.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act'),id=a.getAttribute('data-id');
 switch(act){
  case 'menu':$('#side').classList.add('on');$('#scrim').classList.add('on');setTimeout(function(){var n=$('#nav .nv');if(n)n.focus()},60);break;
  case 'close':closeAll();break;
  case 'toastAct':if(toastFn){var fn=toastFn;toastFn=null;$('#toast').classList.remove('on');fn()}break;
  case 'theme':{var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');st.theme=cur==='dark'?'light':'dark';applyTheme();save();break}
  case 'fav':{var m=ts(id);m.fav=!m.fav;toast(m.fav?'Auf die Merkliste gesetzt':'Von der Merkliste entfernt');refresh();break}
  case 'hide':{var m2=ts(id),was=m2.hide;m2.hide=!was;toast(was?'Wieder eingeblendet':'Ausgeblendet','Rückgängig',function(){m2.hide=was;refresh()});refresh();break}
  case 'pipe':setStage(id,0);refresh();break;
  case 'resetF':F=defaultF();$('#q').value='';syncClr();listLimit=PAGE;render(true);break;
  case 'unset':{var k=a.getAttribute('data-k');F[k]=defaultF()[k];if(k==='land')F.reg='';if(k==='q'){$('#q').value='';syncClr()}listLimit=PAGE;render(true);break}
  case 'widen':F.reg='';listLimit=PAGE;render(true);break;
  case 'moreList':listLimit+=PAGE;renderList();break;
  case 'ftoggle':filtersOpen=!filtersOpen;$('#filters').classList.toggle('collapsed',!filtersOpen);a.setAttribute('aria-expanded',String(filtersOpen));break;
  case 'csv':{var l=filtered();if(!l.length){toast('Keine Einträge zum Exportieren');break}saveFile('ausschreibungen-'+new Date().toISOString().slice(0,10)+'.csv',csv(l),'text/csv;charset=utf-8');break}
  case 'chart':st.chartTable=a.getAttribute('data-v')==='1';render(true);break;
  case 'calJump':{var off=+a.getAttribute('data-off'),dd=dateOf(off);calM=[dd.getFullYear(),dd.getMonth()];calSel=off;go('calendar');break}
  case 'src':if(st.src[id]===false)delete st.src[id];else st.src[id]=false;render(true);break;
  case 'reload':loadFeed(true);render(true);break;
  case 'importFeed':{var tx=$('#fpaste').value.trim();if(!tx){toast('Bitte zuerst Feed-JSON einfügen');break}importFeed(tx,'dem eingefügten Text');break}
  case 'calPrev':calM=[calM[1]===0?calM[0]-1:calM[0],(calM[1]+11)%12];render(true);break;
  case 'calNext':calM=[calM[1]===11?calM[0]+1:calM[0],(calM[1]+1)%12];render(true);break;
  case 'calToday':calM=null;calSel=0;render(true);break;
  case 'calDay':calSel=+a.getAttribute('data-off');render(true);break;
  case 'copyLink':copy(a.getAttribute('data-url'),'Link kopiert');break;
  case 'searchCpv':{var c=a.getAttribute('data-q');F=defaultF();F.q=c;$('#q').value=c;syncClr();go('tenders');break}
  case 'qclr':{var q=$('#q');q.value='';syncClr();hideSug();q.focus();if(F.q){F.q='';listLimit=PAGE;if(st.route==='tenders'){renderList();save()}}break}
 }
});

document.addEventListener('keydown',function(e){
 var el=e.target;
 if(e.key==='Escape'){if(!$('#sug').hidden){hideSug();return}if(openId||$('#side').classList.contains('on'))closeAll();return}
 if(el.id==='q'){if(e.key==='ArrowDown'){e.preventDefault();if($('#sug').hidden)showSug();setSug(sugI+1)}else if(e.key==='ArrowUp'){e.preventDefault();setSug(sugI-1)}return}
 if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!el.isContentEditable){e.preventDefault();$('#q').focus();return}
 if(e.key==='Tab'&&openId){var f=$$('#drawer button,#drawer a,#drawer select,#drawer textarea,#drawer input').filter(function(x){return !x.disabled&&x.offsetParent!==null});if(!f.length)return;
  if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
var qT;
document.addEventListener('input',function(e){var t=e.target,f=t.getAttribute('data-f');
 if(t.id==='q'){syncClr();showSug();if(st.route==='tenders'){clearTimeout(qT);qT=setTimeout(function(){F.q=t.value;listLimit=PAGE;renderList();save()},140)}return}
 if(t.hasAttribute('data-notes')&&openId){ts(openId).notes=t.value.slice(0,5000);save()}});
document.addEventListener('change',function(e){var t=e.target,f=t.getAttribute('data-f');
 if(f){F[f]=t.value;if(f==='land'&&F.reg&&F.reg!=='__none'&&LAND_OF[F.reg]!==F.land)F.reg='';if(f==='reg'&&F.reg&&LAND_OF[F.reg])F.land=LAND_OF[F.reg];listLimit=PAGE;
  var fo=t.id;render(true);var el=document.getElementById(fo);if(el)try{el.focus({preventScroll:true})}catch(x){}return}
 if(t.hasAttribute('data-stage')){setStage(t.getAttribute('data-stage'),t.value);render(true);return}
 if(t.hasAttribute('data-dstage')&&openId){setStage(openId,t.value);refresh();return}
 if(t.hasAttribute('data-chk')&&openId){ts(openId).checks[+t.getAttribute('data-chk')]=t.checked;save();return}
 if(t.id==='ffile'&&t.files&&t.files[0]){var file=t.files[0];if(file.size>80*1024*1024){toast('Die Datei ist größer als 80 MB.');return}var rd=new FileReader();rd.onload=function(){importFeed(String(rd.result),'„'+file.name+'“')};rd.onerror=function(){toast('Die Datei konnte nicht gelesen werden.')};rd.readAsText(file)}});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target;
 if(f.id==='sform'){if(sugI>=0&&sugItems[sugI]){pick(sugI);return}searchAll();return}
 if(f.id==='fform'){st.feed.url=($('#furl').value.trim()||'data/tenders.json').slice(0,500);save();toast('Feed-Adresse gespeichert');loadFeed(true);return}
});

/* Suchvorschläge */
var sugI=-1,sugItems=[];
function syncClr(){var has=!!$('#q').value;$('#qclr').hidden=!has;$('#kbd').hidden=has}
function hideSug(){$('#sug').hidden=true;$('#q').setAttribute('aria-expanded','false');$('#q').removeAttribute('aria-activedescendant');sugI=-1}
function showSug(){
 var q=$('#q').value,tm=terms(q),box=$('#sug');if(!tm.length||!D.tenders.length){hideSug();return}
 var res=[];vis().forEach(function(t){if(hidden(t.id)||t.due<0)return;var r=rel(t,tm);if(r)res.push([t,r])});
 res.sort(function(a,b){return b[1]-a[1]||a[0].due-b[0].due});
 var qn=norm(q.trim());sugItems=[];
 CATS.filter(function(c){return norm(c).indexOf(qn)>-1}).forEach(function(c){sugItems.push({k:'c',c:c})});
 if(qn.length>=3)REGIONS.filter(function(r){return norm(r).indexOf(qn)>-1}).slice(0,2).forEach(function(r){sugItems.push({k:'r',r:r})});
 res.slice(0,6).forEach(function(x){sugItems.push({k:'t',t:x[0]})});
 if(res.length)sugItems.push({k:'a',n:res.length});
 box.innerHTML=sugItems.map(function(it,i){
  if(it.k==='c')return '<button type="button" class="sg" role="option" id="sg'+i+'" data-sug="'+i+'"><b>Kategorie: '+hl(it.c,q)+'</b><small>Alle offenen Ausschreibungen dieser Kategorie</small></button>';
  if(it.k==='r')return '<button type="button" class="sg" role="option" id="sg'+i+'" data-sug="'+i+'"><b>'+esc(regionWord(LAND_OF[it.r]))+': '+hl(it.r,q)+'</b><small>Liste auf '+esc(it.r)+' eingrenzen</small></button>';
  if(it.k==='a')return '<button type="button" class="sg all" role="option" id="sg'+i+'" data-sug="'+i+'">Alle '+it.n.toLocaleString('de-DE')+' Treffer anzeigen</button>';
  return '<button type="button" class="sg" role="option" id="sg'+i+'" data-sug="'+i+'"><b>'+hl(it.t.title,q)+'</b><small>'+esc(it.t.auth||'')+(it.t.reg?' · '+esc(it.t.reg):'')+' · '+esc(dueTxt(it.t))+'</small></button>'}).join('')||'<div class="empty" style="padding:18px">Keine offene Ausschreibung zu „'+esc(q)+'“</div>';
 var r=$('#q').getBoundingClientRect(),W=Math.min(500,innerWidth-32);
 box.style.width=W+'px';box.style.top=(r.bottom+8)+'px';box.style.left=Math.max(16,Math.min(r.left,innerWidth-W-16))+'px';
 box.hidden=false;$('#q').setAttribute('aria-expanded','true');sugI=-1;$('#q').removeAttribute('aria-activedescendant')}
function setSug(i){var n=sugItems.length;if(!n)return;sugI=(i+n)%n;var bs=$$('.sg',$('#sug'));bs.forEach(function(b,k){b.classList.toggle('act',k===sugI);b.setAttribute('aria-selected',String(k===sugI))});if(bs[sugI]){bs[sugI].scrollIntoView({block:'nearest'});$('#q').setAttribute('aria-activedescendant',bs[sugI].id)}}
function pick(i){var it=sugItems[i];if(!it)return;hideSug();
 if(it.k==='t'){openDrawer(it.t.id);return}
 var keepSort=F.sort;F=defaultF();F.sort=keepSort;
 if(it.k==='c')F.cat=it.c;else if(it.k==='r'){F.reg=it.r;F.land=LAND_OF[it.r]}else F.q=$('#q').value.trim();
 if(it.k!=='a'){$('#q').value='';syncClr()}listLimit=PAGE;if(st.route==='tenders')render(true);else go('tenders')}
function searchAll(){F.q=$('#q').value.trim();hideSug();listLimit=PAGE;if(st.route==='tenders'){render(true);return}go('tenders')}
window.addEventListener('scroll',function(){if(!$('#sug').hidden&&document.activeElement!==$('#q'))hideSug()},{passive:true});

/* Drag & Drop in der Pipeline */
var dragId=null;
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[data-card]');if(!c)return;dragId=c.getAttribute('data-card');c.classList.add('drag');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;$$('.drag,.over').forEach(function(x){x.classList.remove('drag','over')})});

var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(st.route==='overview')drawChart();hideSug()},150)});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(ROUTES[h]&&h!==st.route)go(h)});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!D.loadedAt||Date.now()-D.loadedAt>5*6e4))loadFeed(false)});
/* Tageswechsel bei offener Seite: Fristen neu berechnen */
setInterval(function(){var n=new Date();n.setHours(0,0,0,0);if(n.getTime()!==T0){T0=n.getTime();if(D.raw){try{ingest(D.raw)}catch(e){}}refresh()}},6e4*5);

/* ---------------- Start ---------------- */
load();applyTheme();
try{var h0=location.hash.slice(1);if(ROUTES[h0])st.route=h0}catch(e){}
D.loading=true;render();
idb.get('feed').then(function(f){if(f&&!D.tenders.length){try{ingest(f);D.origin='cache'}catch(e){}}D.loading=false;render(true);return loadFeed(false)});
setInterval(function(){if(!document.hidden)loadFeed(false)},10*6e4);
window.__dash={st:function(){return st},D:function(){return D},go:go,filtered:filtered,csv:function(){return csv(filtered())},F:function(){return F}};
})();
